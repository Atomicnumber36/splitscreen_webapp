<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Split Screen</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff}body{height:100%;height:100dvh;width:100%;overflow:hidden}.app{position:fixed;top:0;left:0;right:0;bottom:auto;width:100%;height:100dvh;min-height:0;display:flex;flex-direction:column;padding:0}header strong{font-size:15px}button{border:0;border-radius:9px;background:#334155;color:#fff;padding:9px 12px;font-size:14px}button:active{opacity:.75}.panes{flex:1;min-height:0;min-width:0;display:grid;grid-template-rows:minmax(0,1fr) 6px minmax(0,1fr);grid-template-columns:minmax(0,1fr)}.pane{min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}.bar{display:flex;flex:none;gap:6px;padding:4px;background:#1e293b}.bar input{flex:1;min-width:0;border:0;border-radius:8px;padding:10px;background:#fff;color:#111827;font-size:16px}.bar button{white-space:nowrap}.pane iframe{display:block;width:100%;min-width:0;min-height:0;flex:1 1 0;border:0;background:#fff} .pane{isolation:isolate}.pane iframe{position:absolute;top:0;left:0;width:133.333333%;height:133.333333%;max-width:none;max-height:none;flex:none;transform:scale(.75);transform-origin:top left}.pane .bar{position:relative;z-index:2;margin-top:auto}.divider{height:6px;flex:none;background:#101827;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:row-resize;user-select:none}.divider:after{content:"";width:52px;height:4px;border-radius:9px;background:#94a3b8}.pane{position:relative}.bar.is-hidden{display:none}.show-url{display:block;position:absolute;bottom:0;left:50%;transform:translateX(-50%);z-index:5;width:64px;height:20px;padding:0;border:0;border-radius:12px 12px 0 0;background:rgba(40,52,70,.28);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);touch-action:manipulation}.show-url:after{content:"";display:block;width:38px;height:4px;margin:auto;border-radius:4px;background:rgba(255,255,255,.75);box-shadow:0 0 2px #334155}.pane:not(.url-hidden) .show-url{bottom:48px}.pane.url-hidden .show-url{bottom:0}.note{display:none}body.dragging iframe{pointer-events:none}
@media (orientation:portrait){#bottom .bar{order:0}#bottom .show-url{top:0;bottom:auto;border-radius:0 0 12px 12px}#bottom:not(.url-hidden) .show-url{top:48px;bottom:auto}#bottom.url-hidden .show-url{top:0;bottom:auto}#bottom iframe{order:1}}
@media (orientation:landscape){.panes{grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr) 6px minmax(0,1fr)}.pane{min-width:0;min-height:0}.divider{width:6px;height:auto;cursor:col-resize}.divider:after{width:4px;height:52px}} 
body::before,body::after,.app::before,.app::after{content:''!important;display:block!important;position:fixed!important;width:32px!important;height:32px!important;z-index:2147483647!important;pointer-events:none!important;border:3px solid black!important}body::before{top:0!important;left:0!important;background:#00ff00!important}body::after{top:0!important;right:0!important;background:#00ff00!important}.app::before{bottom:0!important;left:0!important;background:#ff00ff!important}.app::after{bottom:0!important;right:0!important;background:#ff00ff!important}</style></head><body><main class="app"><section class="panes" id="panes"><div class="pane" id="top"><iframe title="Øverste hjemmeside" referrerpolicy="no-referrer"></iframe><form novalidate class="bar" data-id="0"><input aria-label="Øverste webadresse" type="url" inputmode="url" placeholder="https://example.com"><button>Åbn</button></form><button type="button" class="show-url" aria-label="Vis eller skjul adressefelt"></button></div><div class="divider" id="divider" role="separator" aria-label="Træk for at ændre højden" aria-orientation="horizontal"></div><div class="pane" id="bottom"><iframe title="Nederste hjemmeside" referrerpolicy="no-referrer"></iframe><form novalidate class="bar" data-id="1"><input aria-label="Nederste webadresse" type="url" inputmode="url" placeholder="https://example.org"><button>Åbn</button></form><button type="button" class="show-url" aria-label="Vis eller skjul adressefelt"></button></div></section></main><script>
const APP_VERSION='2026-11-17-iframe-zoom-75-33';
// Extend the outer app into the iOS home-indicator safe area while keeping top:0.
// Fixed top/bottom constraints adapt to viewport and orientation changes.

// Test: fill the full reported screen height in installed iOS PWAs.
// Restore the viewport-based height in ordinary browser tabs.
function syncAppScreenHeight(){
 const app=document.querySelector('.app');
 const standalone=navigator.standalone===true || matchMedia('(display-mode: standalone)').matches;
 const h=screen.height;
 app.style.height=standalone && Number.isFinite(h) && h>0 ? h+'px' : '100dvh';
}
syncAppScreenHeight();
addEventListener('orientationchange',()=>setTimeout(syncAppScreenHeight,300));

const panes=document.getElementById('panes'),topPane=document.getElementById('top'),bottomPane=document.getElementById('bottom'),divider=document.getElementById('divider');let ratio=Number(localStorage.getItem('split-ratio')||.5);ratio=Math.max(.2,Math.min(.8,ratio));
function layout(){const horizontal=matchMedia('(orientation:landscape)').matches;if(horizontal){panes.style.gridTemplateColumns=`minmax(0,${ratio}fr) 6px minmax(0,${1-ratio}fr)`;panes.style.gridTemplateRows='minmax(0,1fr)'}else{panes.style.gridTemplateRows=`minmax(0,${ratio}fr) 6px minmax(0,${1-ratio}fr)`;panes.style.gridTemplateColumns='minmax(0,1fr)'}divider.setAttribute('aria-orientation',horizontal?'vertical':'horizontal')}
function normalize(raw){let value=raw.trim();if(!value)return null;if(!/^https?:\/\//i.test(value))value='https://'+value;try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}
const forms=[...document.querySelectorAll('form')];
function showBar(i){const pane=forms[i].parentElement;pane.classList.remove('url-hidden');forms[i].classList.remove('is-hidden');layout()}
function hideBar(i){const pane=forms[i].parentElement;pane.classList.add('url-hidden');forms[i].classList.add('is-hidden');layout()}
forms.forEach((form,i)=>{
 const pane=form.parentElement,frame=pane.querySelector('iframe');
 pane.querySelector('.show-url').addEventListener('click',()=>{if(pane.classList.contains('url-hidden')){showBar(i);form.querySelector('input').focus()}else{form.querySelector('input').blur();hideBar(i)}});
 frame.addEventListener('focus',()=>hideBar(i));
 frame.addEventListener('pointerdown',()=>hideBar(i));
});
window.addEventListener('blur',()=>{const focused=document.activeElement;const i=forms.findIndex(form=>form.parentElement.querySelector('iframe')===focused);if(i!==-1)hideBar(i)});
function load(i,raw){const url=normalize(raw);if(!url){alert('Indtast en gyldig webadresse');return}forms[i].querySelector('input').value=url;const pane=forms[i].parentElement;const frame=pane.querySelector('iframe');frame.removeAttribute('srcdoc');frame.src=url;localStorage.setItem('split-url-'+i,url);forms[i].querySelector('input').blur();hideBar(i)}
forms.forEach((form,i)=>{form.addEventListener('submit',e=>{e.preventDefault();load(i,form.querySelector('input').value)});const saved=localStorage.getItem('split-url-'+i);if(saved)load(i,saved);else{const frame=form.parentElement.querySelector('iframe');frame.srcdoc='<html lang="da"><meta name="viewport" content="width=device-width,initial-scale=1"><body style="font:16px -apple-system,sans-serif;padding:22px;color:#334155"><h3>Vindue '+(i+1)+' er klar</h3><p>Skriv en webadresse ovenfor og tryk Åbn.</p><p>Bemærk: Mange hjemmesider tillader ikke visning inde i andre hjemmesider.</p></body></html>'}});
divider.addEventListener('pointerdown',e=>{divider.setPointerCapture(e.pointerId);document.body.classList.add('dragging')});divider.addEventListener('pointermove',e=>{if(!divider.hasPointerCapture(e.pointerId))return;const r=panes.getBoundingClientRect();const horizontal=matchMedia('(orientation:landscape)').matches;ratio=Math.max(.2,Math.min(.8,horizontal?(e.clientX-r.left)/(r.width-divider.offsetWidth):(e.clientY-r.top)/(r.height-divider.offsetHeight)));layout()});function stop(){document.body.classList.remove('dragging');localStorage.setItem('split-ratio',ratio)}divider.addEventListener('pointerup',stop);divider.addEventListener('pointercancel',stop);document.addEventListener('focusout',()=>{window.scrollTo(0,0);requestAnimationFrame(layout);setTimeout(layout,350);setTimeout(layout,800)});window.addEventListener('resize',layout);window.addEventListener('orientationchange',()=>{layout.maxHeight=0;requestAnimationFrame(layout);setTimeout(layout,400)});if(window.visualViewport){window.visualViewport.addEventListener('resize',layout);window.visualViewport.addEventListener('scroll',layout)}layout();

// Check the published HTML rather than relying on cached responses.
// Reload only when a newer deployment is detected, preserving saved URLs and split ratio.
let checkingUpdate=false;
async function checkForUpdate(){
 if(checkingUpdate||!navigator.onLine)return;
 checkingUpdate=true;
 try{
  const response=await fetch('./index.html?update-check='+Date.now(),{cache:'no-store'});
  if(!response.ok)return;
  const html=await response.text();
  const found=html.match(/const APP_VERSION='([^']+)'/);
  if(found&&found[1]!==APP_VERSION)location.reload();
 }catch(e){/* Offline: keep the app usable. */}
 finally{checkingUpdate=false}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkForUpdate()});
window.addEventListener('pageshow',()=>checkForUpdate());
window.addEventListener('online',()=>checkForUpdate());
setInterval(()=>{if(!document.hidden)checkForUpdate()},60000);


// Permanent test markers: green = viewport corners, orange = app corners.
(function(){
 const css=document.createElement('style');
 css.textContent='.corner-test{position:fixed;z-index:2147483646;width:22px;height:22px;background:#00ff55;border:2px solid #000;pointer-events:none}.corner-test.tl{top:0;left:0}.corner-test.tr{top:0;right:0}.corner-test.bl{bottom:0;left:0}.corner-test.br{bottom:0;right:0}.app-corner-test{position:absolute;z-index:2147483645;width:14px;height:14px;background:#ff8800;border:2px solid #000;pointer-events:none}.app-corner-test.tl{top:0;left:0}.app-corner-test.tr{top:0;right:0}.app-corner-test.bl{bottom:0;left:0}.app-corner-test.br{bottom:0;right:0}';
 document.head.appendChild(css);
 for(const pos of ['tl','tr','bl','br']){
  const screen=document.createElement('div');screen.className='corner-test '+pos;document.body.appendChild(screen);
  const app=document.createElement('div');app.className='app-corner-test '+pos;document.querySelector('.app').appendChild(app);
 }
})();

// Temporary viewport diagnostics: enable with ?debug=1.
{
 const hud=document.createElement('pre');
 hud.style.cssText='position:fixed;z-index:2147483647;left:6px;top:95px;max-width:96vw;margin:0;padding:8px;background:rgba(0,0,0,.85);color:#00ff99;font:11px/1.4 monospace;white-space:pre-wrap;pointer-events:none';
 document.body.appendChild(hud);
 const report=()=>{
  const app=document.querySelector('.app'),bottom=document.querySelector('#bottom');
  const a=app?.getBoundingClientRect(),b=bottom?.getBoundingClientRect(),v=window.visualViewport;
  hud.textContent='innerHeight '+innerHeight+' / clientHeight '+document.documentElement.clientHeight+'\n'+
   'screen '+screen.width+'x'+screen.height+' / outerHeight '+outerHeight+'\n'+
   'visual '+(v?.height?.toFixed(1)??'n/a')+' offset '+(v?.offsetTop?.toFixed(1)??'n/a')+'\n'+
   'app bottom '+(a?.bottom?.toFixed(1)??'n/a')+' / lower bottom '+(b?.bottom?.toFixed(1)??'n/a')+'\n'+
   'safe bottom '+getComputedStyle(document.documentElement).getPropertyValue('padding-bottom')+'\n'+
   'standalone '+(navigator.standalone===true);
 };
 report();addEventListener('resize',report);window.visualViewport?.addEventListener('resize',report);
 setInterval(report,400);
}
</script></body></html>
