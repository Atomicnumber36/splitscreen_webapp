<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Split Screen</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#101827;color:#fff}body{height:100dvh;overflow:hidden}.app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}header strong{font-size:15px}button{border:0;border-radius:9px;background:#334155;color:#fff;padding:9px 12px;font-size:14px}button:active{opacity:.75}.panes{flex:1;min-height:0;display:flex;flex-direction:column}.pane{min-height:65px;display:flex;flex-direction:column;overflow:hidden}.bar{display:flex;gap:6px;padding:4px;background:#1e293b}.bar input{flex:1;min-width:0;border:0;border-radius:8px;padding:10px;background:#fff;color:#111827;font-size:16px}.bar button{white-space:nowrap}.pane iframe{width:100%;flex:1;border:0;background:#fff}.status{display:flex;align-items:center;gap:8px;padding:5px 9px;background:#e2e8f0;color:#334155;font-size:12px}.status span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.status a{color:#1d4ed8;font-weight:600;white-space:nowrap}.divider{height:12px;flex:none;background:#101827;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:row-resize;user-select:none}.divider:after{content:"";width:52px;height:4px;border-radius:9px;background:#94a3b8}.note{display:none}body.dragging iframe{pointer-events:none}
@media (orientation:landscape){.panes{flex-direction:row}.pane{min-width:0;min-height:0}.divider{width:12px;height:auto;cursor:col-resize}.divider:after{width:4px;height:52px}} 
</style></head><body><main class="app"><section class="panes" id="panes"><div class="pane" id="top"><form novalidate class="bar" data-id="0"><input aria-label="Øverste webadresse" type="url" inputmode="url" placeholder="https://example.com"><button>Åbn</button></form><div class="status"><span>Indtast en adresse ovenfor</span><a href="#" target="_blank" rel="noopener noreferrer" hidden>Åbn i Safari</a></div><iframe title="Øverste hjemmeside" referrerpolicy="no-referrer"></iframe></div><div class="divider" id="divider" role="separator" aria-label="Træk for at ændre højden" aria-orientation="horizontal"></div><div class="pane" id="bottom"><form novalidate class="bar" data-id="1"><input aria-label="Nederste webadresse" type="url" inputmode="url" placeholder="https://example.org"><button>Åbn</button></form><div class="status"><span>Indtast en adresse ovenfor</span><a href="#" target="_blank" rel="noopener noreferrer" hidden>Åbn i Safari</a></div><iframe title="Nederste hjemmeside" referrerpolicy="no-referrer"></iframe></div></section><div class="note">Hvid side? Tryk “Åbn i Safari” i statuslinjen. Mange hjemmesider tillader ikke indlejring.</div></main><script>
const panes=document.getElementById('panes'),topPane=document.getElementById('top'),bottomPane=document.getElementById('bottom'),divider=document.getElementById('divider');let ratio=Number(localStorage.getItem('split-ratio')||.5);ratio=Math.max(.2,Math.min(.8,ratio));
function layout(){const horizontal=matchMedia('(orientation:landscape)').matches;const available=(horizontal?panes.clientWidth-divider.offsetWidth:panes.clientHeight-divider.offsetHeight);topPane.style.width=horizontal?(available*ratio)+'px':'';bottomPane.style.width=horizontal?(available*(1-ratio))+'px':'';topPane.style.height=horizontal?'':(available*ratio)+'px';bottomPane.style.height=horizontal?'':(available*(1-ratio))+'px';topPane.style.flex='none';bottomPane.style.flex='none';divider.setAttribute('aria-orientation',horizontal?'vertical':'horizontal')}
function normalize(raw){let value=raw.trim();if(!value)return null;if(!/^https?:\/\//i.test(value))value='https://'+value;try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}
const forms=[...document.querySelectorAll('form')];function load(i,raw){const url=normalize(raw);if(!url){alert('Indtast en gyldig webadresse');return}forms[i].querySelector('input').value=url;const pane=forms[i].parentElement;pane.querySelector('.status span').textContent='Åbner: '+url;const link=pane.querySelector('.status a');link.href=url;link.hidden=false;pane.querySelector('iframe').src=url;localStorage.setItem('split-url-'+i,url)}
forms.forEach((form,i)=>{form.addEventListener('submit',e=>{e.preventDefault();load(i,form.querySelector('input').value)});const saved=localStorage.getItem('split-url-'+i);if(saved)load(i,saved);else{const frame=form.parentElement.querySelector('iframe');frame.srcdoc='<html lang="da"><meta name="viewport" content="width=device-width,initial-scale=1"><body style="font:16px -apple-system,sans-serif;padding:22px;color:#334155"><h3>Vindue '+(i+1)+' er klar</h3><p>Skriv en webadresse ovenfor og tryk Åbn.</p><p>Bemærk: Mange hjemmesider tillader ikke visning inde i andre hjemmesider.</p></body></html>'}});
divider.addEventListener('pointerdown',e=>{divider.setPointerCapture(e.pointerId);document.body.classList.add('dragging')});divider.addEventListener('pointermove',e=>{if(!divider.hasPointerCapture(e.pointerId))return;const r=panes.getBoundingClientRect();const horizontal=matchMedia('(orientation:landscape)').matches;ratio=Math.max(.2,Math.min(.8,horizontal?(e.clientX-r.left)/(r.width-divider.offsetWidth):(e.clientY-r.top)/(r.height-divider.offsetHeight)));layout()});function stop(){document.body.classList.remove('dragging');localStorage.setItem('split-ratio',ratio)}divider.addEventListener('pointerup',stop);divider.addEventListener('pointercancel',stop);window.addEventListener('resize',layout);layout();
</script></body></html>
