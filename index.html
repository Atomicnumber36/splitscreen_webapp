<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Split Screen</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#101827;color:#fff}body{height:100dvh;overflow:hidden}.app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;gap:8px}header strong{font-size:15px}button{border:0;border-radius:9px;background:#334155;color:#fff;padding:9px 12px;font-size:14px}button:active{opacity:.75}.panes{flex:1;min-height:0;display:flex;flex-direction:column}.pane{min-height:65px;display:flex;flex-direction:column;overflow:hidden}.bar{display:flex;gap:6px;padding:7px;background:#1e293b}.bar input{flex:1;min-width:0;border:0;border-radius:8px;padding:10px;background:#fff;color:#111827;font-size:16px}.bar button{white-space:nowrap}.pane iframe{width:100%;flex:1;border:0;background:#fff}.divider{height:20px;flex:none;background:#101827;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:row-resize;user-select:none}.divider:after{content:"";width:52px;height:5px;border-radius:9px;background:#94a3b8}.note{font-size:11px;color:#cbd5e1;text-align:center;padding:4px 8px}body.dragging iframe{pointer-events:none}
</style></head><body><main class="app"><header><strong>Split Screen</strong><button id="swap" type="button">Byt vinduer</button></header><section class="panes" id="panes"><div class="pane" id="top"><form class="bar" data-id="0"><input aria-label="Øverste webadresse" type="url" inputmode="url" placeholder="https://example.com"><button>Åbn</button></form><iframe title="Øverste hjemmeside" referrerpolicy="no-referrer"></iframe></div><div class="divider" id="divider" role="separator" aria-label="Træk for at ændre højden" aria-orientation="horizontal"></div><div class="pane" id="bottom"><form class="bar" data-id="1"><input aria-label="Nederste webadresse" type="url" inputmode="url" placeholder="https://example.org"><button>Åbn</button></form><iframe title="Nederste hjemmeside" referrerpolicy="no-referrer"></iframe></div></section><div class="note">Nogle hjemmesider blokerer visning i andre apps.</div></main><script>
const panes=document.getElementById('panes'),topPane=document.getElementById('top'),bottomPane=document.getElementById('bottom'),divider=document.getElementById('divider');let ratio=Number(localStorage.getItem('split-ratio')||.5);ratio=Math.max(.2,Math.min(.8,ratio));
function layout(){const available=panes.clientHeight-divider.offsetHeight;topPane.style.height=(available*ratio)+'px';bottomPane.style.height=(available*(1-ratio))+'px';topPane.style.flex='none';bottomPane.style.flex='none'}
function normalize(raw){let value=raw.trim();if(!value)return null;if(!/^https?:\/\//i.test(value))value='https://'+value;try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}
const forms=[...document.querySelectorAll('form')];function load(i,raw){const url=normalize(raw);if(!url){alert('Indtast en gyldig webadresse');return}forms[i].querySelector('input').value=url;forms[i].parentElement.querySelector('iframe').src=url;localStorage.setItem('split-url-'+i,url)}
forms.forEach((form,i)=>{form.addEventListener('submit',e=>{e.preventDefault();load(i,form.querySelector('input').value)});const saved=localStorage.getItem('split-url-'+i);if(saved)load(i,saved)});
document.getElementById('swap').addEventListener('click',()=>{const urls=forms.map(f=>f.querySelector('input').value);urls.forEach((_,i)=>{const target=urls[1-i];if(target)load(i,target);else{forms[i].querySelector('input').value='';forms[i].parentElement.querySelector('iframe').removeAttribute('src');localStorage.removeItem('split-url-'+i)}})});
divider.addEventListener('pointerdown',e=>{divider.setPointerCapture(e.pointerId);document.body.classList.add('dragging')});divider.addEventListener('pointermove',e=>{if(!divider.hasPointerCapture(e.pointerId))return;const r=panes.getBoundingClientRect();ratio=Math.max(.2,Math.min(.8,(e.clientY-r.top)/(r.height-divider.offsetHeight)));layout()});function stop(){document.body.classList.remove('dragging');localStorage.setItem('split-ratio',ratio)}divider.addEventListener('pointerup',stop);divider.addEventListener('pointercancel',stop);window.addEventListener('resize',layout);layout();
</script></body></html>
