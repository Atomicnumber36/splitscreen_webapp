<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Split Screen</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff}body{height:100%;height:100dvh;width:100%;overflow:hidden}html,body,.app{background:#101827}.app{position:fixed;top:0;left:0;right:0;bottom:auto;width:100%;height:100dvh;min-height:0;display:flex;flex-direction:column;padding:0}header strong{font-size:15px}button{border:0;border-radius:9px;background:#334155;color:#fff;padding:9px 12px;font-size:14px}button:active{opacity:.75}.panes{flex:1;min-height:0;min-width:0;display:grid;grid-template-rows:minmax(0,1fr) 6px minmax(0,1fr);grid-template-columns:minmax(0,1fr)}.pane{min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}.bar{display:flex;flex:none;gap:6px;padding:4px;background:#1e293b}.bar input{flex:1;min-width:0;border:0;border-radius:8px;padding:10px;background:#fff;color:#111827;font-size:16px}.bar button{white-space:nowrap}.pane iframe{display:block;width:100%;min-width:0;min-height:0;flex:1 1 0;border:0;background:#fff}.divider{height:6px;flex:none;background:#101827;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:row-resize;user-select:none}.divider:after{content:"";width:52px;height:4px;border-radius:9px;background:#94a3b8}.pane{position:relative}.bar.is-hidden{display:none}.show-url{display:block;position:absolute;bottom:0;left:50%;transform:translateX(-50%);z-index:5;width:64px;height:20px;padding:0;border:0;border-radius:12px 12px 0 0;background:rgba(40,52,70,.28);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);touch-action:manipulation}.show-url:after{content:"";display:block;width:38px;height:4px;margin:auto;border-radius:4px;background:rgba(255,255,255,.75);box-shadow:0 0 2px #334155}.pane:not(.url-hidden) .show-url{bottom:48px}.pane.url-hidden .show-url{bottom:0}.note{display:none}body.dragging iframe{pointer-events:none}
@media (orientation:portrait){#bottom .bar{order:0}#bottom .show-url{top:0;bottom:auto;border-radius:0 0 12px 12px}#bottom:not(.url-hidden) .show-url{top:48px;bottom:auto}#bottom.url-hidden .show-url{top:0;bottom:auto}#bottom iframe{order:1}}
@media (orientation:landscape){.panes{grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr) 6px minmax(0,1fr)}.pane{min-width:0;min-height:0}.divider{width:6px;height:auto;cursor:col-resize}.divider:after{width:4px;height:52px}} 

/* Full-height page surface; zoom only the embedded website. */
.web-content{position:relative;flex:1 1 0;min-width:0;min-height:0;overflow:hidden;background:#fff;isolation:isolate}
.web-content>iframe{position:absolute;top:0;left:0;display:block;width:133.333333%;height:133.333333%;max-width:none;max-height:none;min-width:0;min-height:0;flex:none;border:0;background:#fff;transform:scale(.75);transform-origin:top left}
@media (orientation:portrait){#bottom .web-content{order:1}}

/* Safari-inspired floating address pill; overlays the page without resizing panes. */
.pane .bar{position:absolute;left:12px;right:12px;bottom:28px;z-index:6;display:flex;align-items:center;gap:6px;padding:5px 5px 5px 14px;min-height:48px;border:1px solid rgba(255,255,255,.55);border-radius:999px;background:rgba(245,247,250,.94);box-shadow:0 8px 28px rgba(0,0,0,.22);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.pane .bar.is-hidden{display:none}
.pane .bar input{background:transparent;border:0;outline:none;border-radius:0;padding:7px 2px;color:#172033;font-size:16px;min-width:0}
.pane .bar button{flex:none;border-radius:999px;padding:10px 16px;background:#273b56;color:#fff;font-weight:600;font-size:13px}
@media (orientation:portrait){#bottom .bar{top:28px;bottom:auto}}

/* Temporary drag feedback, visible only while the divider is held. */
.divider{position:relative;z-index:7}
.divider::before{content:"↕";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.85);width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(24,38,58,.78);color:#fff;font-size:27px;font-weight:500;line-height:1;box-shadow:0 5px 18px rgba(0,0,0,.28);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .13s ease,transform .13s ease}
body.dragging .divider::before{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media (orientation:landscape){.divider::before{content:"↔"}}

/* Larger invisible touch target without making the 6px divider thicker. */
.divider::after{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:100%;height:44px;min-width:44px;background:linear-gradient(to right,transparent calc(50% - 26px),#94a3b8 calc(50% - 26px),#94a3b8 calc(50% + 26px),transparent calc(50% + 26px)) center/100% 4px no-repeat;touch-action:none}
@media (orientation:landscape){.divider::after{width:44px;height:100%;min-height:44px;background:linear-gradient(to bottom,transparent calc(50% - 26px),#94a3b8 calc(50% - 26px),#94a3b8 calc(50% + 26px),transparent calc(50% + 26px)) center/4px 100% no-repeat}}

/* Show one clear symbol while dragging; hide the underlying grip. */
body.dragging .divider::after{background:none}
</style></head><body><main class="app"><section class="panes" id="panes"><div class="pane" id="top"><div class="web-content"><iframe title="Øverste hjemmeside" referrerpolicy="no-referrer"></iframe></div><form novalidate class="bar" data-id="0"><input aria-label="Øverste webadresse" type="url" inputmode="url" placeholder="https://example.com"><button>Åbn</button></form><button type="button" class="show-url" aria-label="Vis eller skjul adressefelt"></button></div><div class="divider" id="divider" role="separator" aria-label="Træk for at ændre højden" aria-orientation="horizontal"></div><div class="pane" id="bottom"><div class="web-content"><iframe title="Nederste hjemmeside" referrerpolicy="no-referrer"></iframe></div><form novalidate class="bar" data-id="1"><input aria-label="Nederste webadresse" type="url" inputmode="url" placeholder="https://example.org"><button>Åbn</button></form><button type="button" class="show-url" aria-label="Vis eller skjul adressefelt"></button></div></section></main><script>
const APP_VERSION='2026-11-17-single-drag-icon-48';
// Extend the outer app into the iOS home-indicator safe area while keeping top:0.
// Fixed top/bottom constraints adapt to viewport and orientation changes.

// Test: fill the full reported screen height in installed iOS PWAs.
// Restore the viewport-based height in ordinary browser tabs.
function syncAppScreenHeight(){
 const app=document.querySelector('.app');
 const standalone=navigator.standalone===true || matchMedia('(display-mode: standalone)').matches;
 const h=screen.height;
 app.style.height=standalone && matchMedia('(orientation:portrait)').matches && Number.isFinite(h) && h>0 ? h+'px' : '100dvh';
}
syncAppScreenHeight();
addEventListener('orientationchange',()=>setTimeout(syncAppScreenHeight,300));

const panes=document.getElementById('panes'),topPane=document.getElementById('top'),bottomPane=document.getElementById('bottom'),divider=document.getElementById('divider');let ratio=Number(localStorage.getItem('split-ratio')||.5);ratio=Math.max(.2,Math.min(.8,ratio));
function layout(){const horizontal=matchMedia('(orientation:landscape)').matches;if(horizontal){panes.style.gridTemplateColumns=`minmax(0,${ratio}fr) 6px minmax(0,${1-ratio}fr)`;panes.style.gridTemplateRows='minmax(0,1fr)'}else{panes.style.gridTemplateRows=`minmax(0,${ratio}fr) 6px minmax(0,${1-ratio}fr)`;panes.style.gridTemplateColumns='minmax(0,1fr)'}divider.setAttribute('aria-orientation',horizontal?'vertical':'horizontal')}
function normalize(raw){let value=raw.trim();if(!value)return null;if(!/^https?:\/\//i.test(value))value='https://'+value;try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}
const forms=[...document.querySelectorAll('form')];
function showBar(i){const pane=forms[i].parentElement;pane.classList.remove('url-hidden');forms[i].classList.remove('is-hidden');layout()}
function hideBar(i){const pane=forms[i].parentElement;pane.classList.add('url-hidden');forms[i].classList.add('is-hidden');layout()}
forms.forEach((form,i)=>{
 const pane=form.parentElement,frame=pane.querySelector('iframe');
 pane.querySelector('.show-url').addEventListener('click',()=>{if(pane.classList.contains('url-hidden')){showBar(i);form.querySelector('input').focus()}else{form.querySelector('input').blur();hideBar(i)}});
 frame.addEventListener('focus',()=>hideBar(i));
 frame.addEventListener('pointerdown',()=>hideBar(i));
});
window.addEventListener('blur',()=>{const focused=document.activeElement;const i=forms.findIndex(form=>form.parentElement.querySelector('iframe')===focused);if(i!==-1)hideBar(i)});
function load(i,raw){const url=normalize(raw);if(!url){alert('Indtast en gyldig webadresse');return}forms[i].querySelector('input').value=url;const pane=forms[i].parentElement;const frame=pane.querySelector('iframe');frame.removeAttribute('srcdoc');frame.src=url;localStorage.setItem('split-url-'+i,url);forms[i].querySelector('input').blur();hideBar(i)}
forms.forEach((form,i)=>{form.addEventListener('submit',e=>{e.preventDefault();load(i,form.querySelector('input').value)});const saved=localStorage.getItem('split-url-'+i);if(saved)load(i,saved);else{const frame=form.parentElement.querySelector('iframe');frame.srcdoc='<html lang="da"><meta name="viewport" content="width=device-width,initial-scale=1"><body style="font:16px -apple-system,sans-serif;padding:22px;color:#334155"><h3>Vindue '+(i+1)+' er klar</h3><p>Skriv en webadresse ovenfor og tryk Åbn.</p><p>Bemærk: Mange hjemmesider tillader ikke visning inde i andre hjemmesider.</p></body></html>'}});
divider.addEventListener('pointerdown',e=>{divider.setPointerCapture(e.pointerId);document.body.classList.add('dragging')});divider.addEventListener('pointermove',e=>{if(!divider.hasPointerCapture(e.pointerId))return;const r=panes.getBoundingClientRect();const horizontal=matchMedia('(orientation:landscape)').matches;ratio=Math.max(.2,Math.min(.8,horizontal?(e.clientX-r.left)/(r.width-divider.offsetWidth):(e.clientY-r.top)/(r.height-divider.offsetHeight)));layout()});function stop(){document.body.classList.remove('dragging');localStorage.setItem('split-ratio',ratio)}divider.addEventListener('pointerup',stop);divider.addEventListener('pointercancel',stop);document.addEventListener('focusout',()=>{window.scrollTo(0,0);requestAnimationFrame(layout);setTimeout(layout,350);setTimeout(layout,800)});window.addEventListener('resize',layout);window.addEventListener('orientationchange',()=>{layout.maxHeight=0;requestAnimationFrame(layout);setTimeout(layout,400)});if(window.visualViewport){window.visualViewport.addEventListener('resize',layout);window.visualViewport.addEventListener('scroll',layout)}layout();

// Check the published HTML rather than relying on cached responses.
// Reload only when a newer deployment is detected, preserving saved URLs and split ratio.
let checkingUpdate=false;
async function checkForUpdate(){
 if(checkingUpdate||!navigator.onLine)return;
 checkingUpdate=true;
 try{
  const response=await fetch('./index.html?update-check='+Date.now(),{cache:'no-store'});
  if(!response.ok)return;
  const html=await response.text();
  const found=html.match(/const APP_VERSION='([^']+)'/);
  if(found&&found[1]!==APP_VERSION)location.reload();
 }catch(e){/* Offline: keep the app usable. */}
 finally{checkingUpdate=false}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkForUpdate()});
window.addEventListener('pageshow',()=>checkForUpdate());
window.addEventListener('online',()=>checkForUpdate());
setInterval(()=>{if(!document.hidden)checkForUpdate()},60000);


</script></body></html>
